<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parks Pal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
  :root {
    --forest: #2D5016;
    --forest-ink: #23400f;
    --sage: #6B8C5A;
    --cream: #EAD9B7;
    --tan: #C9A96E;
    --bg: #FFFFFF;
    --surface: #FBF8F2;
    --text-primary: #2B2116;
    --text-secondary: #5A5140;
    --text-muted: #8A8270;
    --border: #E7DFCC;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1811; --surface: #242019; --text-primary: #F3EEE2;
      --text-secondary: #C7BFAB; --text-muted: #8E8672; --border: #38321F;
      --forest: #7FA35C; --forest-ink: #9FC17E; --cream: #3A3220;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1811; --surface: #242019; --text-primary: #F3EEE2;
    --text-secondary: #C7BFAB; --text-muted: #8E8672; --border: #38321F;
    --forest: #7FA35C; --forest-ink: #9FC17E; --cream: #3A3220;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Nunito', system-ui, -apple-system, sans-serif;
    padding: 0 20px;
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
  }
  .card { width: 100%; max-width: 420px; padding-block: 48px; text-align: center; }
  .mark {
    width: 60px; height: 60px; border-radius: 16px;
    background: var(--forest);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
  }
  .mark svg { width: 32px; height: 32px; }
  h1 {
    font-family: 'Fredoka', system-ui, sans-serif;
    font-weight: 700;
    font-size: 30px;
    margin: 0 0 8px;
  }
  .tag {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--sage);
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .links { display: flex; flex-direction: column; gap: 12px; }
  a.linkcard {
    display: block;
    padding: 16px 20px;
    border-radius: 14px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text-primary);
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    transition: border-color 0.15s ease;
  }
  a.linkcard:hover { border-color: var(--forest); }
  a.linkcard span.sub {
    display: block;
    font-weight: 400;
    font-size: 13.5px;
    color: var(--text-muted);
    margin-top: 3px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 3 3 19h18L12 3Z" fill="#FFFFFF" opacity="0.95"/>
        <path d="M12 3 6.2 13.2 9 12l1.6 2.2L14 10l4.9 9H21L12 3Z" fill="#EAD9B7" opacity="0.9"/>
      </svg>
    </div>
    <h1>Parks Pal</h1>
    <div class="tag">Collect. Explore. Remember.</div>
    <div class="links">
      <a class="linkcard" href="/support">Support<span class="sub">Get help or send feedback</span></a>
      <a class="linkcard" href="/privacy">Privacy Policy<span class="sub">What we collect and how it's used</span></a>
    </div>
  </div>
</body>
</html>
