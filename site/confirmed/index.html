<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parks Pal Email Confirmed</title>
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
  :root {
    --forest: #2D5016;
    --forest-ink: #23400f;
    --sage: #6B8C5A;
    --cream: #EAD9B7;
    --tan: #C9A96E;
    --bg: #FFFFFF;
    --surface: #FBF8F2;
    --text-primary: #2B2116;
    --text-secondary: #5A5140;
    --text-muted: #8A8270;
    --border: #E7DFCC;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1811; --surface: #242019; --text-primary: #F3EEE2;
      --text-secondary: #C7BFAB; --text-muted: #8E8672; --border: #38321F;
      --forest: #7FA35C; --forest-ink: #9FC17E; --cream: #3A3220;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1811; --surface: #242019; --text-primary: #F3EEE2;
    --text-secondary: #C7BFAB; --text-muted: #8E8672; --border: #38321F;
    --forest: #7FA35C; --forest-ink: #9FC17E; --cream: #3A3220;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Nunito', system-ui, -apple-system, sans-serif;
    padding: 0 20px;
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
  }
  .card { width: 100%; max-width: 400px; padding-block: 48px; }
  .mark { width: 52px; height: 52px; border-radius: 14px; background: var(--forest); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
  .mark svg { width: 28px; height: 28px; }
  h1 { font-family: 'Fredoka', system-ui, sans-serif; font-weight: 700; font-size: 26px; text-align: center; margin: 0 0 8px; text-wrap: balance; }
  .sub { text-align: center; color: var(--text-secondary); font-size: 15px; line-height: 1.5; margin: 0 0 8px; }
  .state { text-align: center; }
  .badge {
    width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .badge.ok { background: var(--surface); border: 2px solid var(--forest); }
  .badge.warn { background: var(--surface); border: 2px solid var(--tan); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="card">
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M12 3 3 19h18L12 3Z" fill="#FFFFFF" opacity="0.95"/>
      <path d="M12 3 6.2 13.2 9 12l1.6 2.2L14 10l4.9 9H21L12 3Z" fill="#EAD9B7" opacity="0.9"/>
    </svg>
  </div>

  <div id="successState" class="state" hidden>
    <div class="badge ok" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
        <path d="M5 12.5 9.5 17 19 7" stroke="#2D5016" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>You're confirmed!</h1>
    <p class="sub">Your Parks Pal account is ready. Head back to the app and log in to start tracking your parks.</p>
  </div>

  <div id="invalidState" class="state" hidden>
    <div class="badge warn" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
        <path d="M12 8.5v5" stroke="#C9A96E" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="12" cy="16.5" r="1.3" fill="#C9A96E"/>
        <circle cx="12" cy="12" r="9" stroke="#C9A96E" stroke-width="1.8"/>
      </svg>
    </div>
    <h1>This link has expired</h1>
    <p class="sub">Confirmation links only work once and expire after a while. Go back to the app and try signing up again to get a new one.</p>
  </div>
</div>

<script>
  function parseHashParams() {
    const hash = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : window.location.hash;
    return new URLSearchParams(hash);
  }

  const successState = document.getElementById('successState');
  const invalidState = document.getElementById('invalidState');

  const hashParams = parseHashParams();
  const queryParams = new URLSearchParams(window.location.search);
  const errorCode = hashParams.get('error_code') || queryParams.get('error_code');

  if (errorCode) {
    invalidState.hidden = false;
  } else {
    successState.hidden = false;
  }
</script>
</body>
</html>
